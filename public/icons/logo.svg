<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#171f33" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="indigoVibe" x1="20" y1="20" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="mintSpark" x1="65" y1="20" x2="100" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Inner Ambient Glow -->
  <circle cx="60" cy="60" r="38" fill="#6366f1" fill-opacity="0.12" />

  <!-- Modular App Grid Tiles (Representing '아무거나' Multi-Utility Suite) -->
  <!-- Top-Left Tile: Rounded Square -->
  <rect x="26" y="28" width="28" height="28" rx="8" fill="url(#indigoVibe)" />
  
  <!-- Bottom-Left Tile: Circle ('ㅇ' motif of 아무거나) -->
  <circle cx="40" cy="78" r="14" fill="none" stroke="#a5b4fc" stroke-width="6" />

  <!-- Bottom-Right Tile: Code / Vibe Wave Bracket -->
  <rect x="64" y="64" width="28" height="28" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="2.5" />
  <path d="M73 74L69 78L73 82M83 74L87 78L83 82" stroke="#c7d2fe" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top-Right Tile: 4-Point Vibe Sparkle Star (Matching Simple Reader & Word Smart icon motif) -->
  <path
    d="M80 20C80 31 89 40 100 40C89 40 80 49 80 60C80 49 71 40 60 40C71 40 80 31 80 20Z"
    fill="url(#mintSpark)"
    filter="url(#glow)"
  />
</svg>
